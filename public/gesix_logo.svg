<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- White background -->
  <rect width="200" height="220" fill="white"/>
  
  <!-- GESIX hexagonal/angular G-shape icon -->
  <!-- Outer green C/G arc shape -->
  <!-- Top-left green bar -->
  <rect x="40" y="20" width="100" height="28" rx="4" fill="#8DC63F"/>
  <!-- Left green vertical bar -->
  <rect x="40" y="20" width="28" height="120" rx="4" fill="#8DC63F"/>
  <!-- Bottom-left green bar -->
  <rect x="40" y="112" width="70" height="28" rx="4" fill="#8DC63F"/>
  
  <!-- Inner blue parts - like a bracket or F shape offset -->
  <!-- Top blue bar (inner, offset right) -->
  <rect x="90" y="48" width="70" height="22" rx="3" fill="#29ABE2"/>
  <!-- Middle blue bar -->
  <rect x="90" y="78" width="70" height="22" rx="3" fill="#29ABE2"/>
  <!-- Right blue vertical connecting bar -->
  <rect x="138" y="48" width="22" height="52" rx="3" fill="#29ABE2"/>

  <!-- GESIX text -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="3">GESIX</text>
</svg>
