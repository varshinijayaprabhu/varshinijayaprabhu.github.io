<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140">
  <defs>
    <linearGradient id="bandhanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B5EA7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C4DCC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- White background -->
  <rect width="380" height="140" fill="white"/>
  
  <!-- bandhan text with gradient -->
  <text x="20" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="700" fill="url(#bandhanGrad)" letter-spacing="-1">bandhan</text>
  
  <!-- TECHNOLOGIES text -->
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#333333" letter-spacing="6">TECHNOLOGIES</text>
</svg>
