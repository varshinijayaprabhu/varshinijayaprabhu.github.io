<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- White background -->
  <rect width="400" height="200" fill="white"/>
  
  <!-- Pinwheel/cross icon - 4 triangular segments -->
  <!-- Green top segment -->
  <polygon points="90,30 70,90 110,90" fill="#2ECC40"/>
  <!-- Red right segment -->
  <polygon points="150,70 90,90 110,130" fill="#FF4136"/>
  <!-- Yellow bottom segment -->
  <polygon points="90,150 70,110 110,110" fill="#FFDC00"/>
  <!-- Blue left segment -->
  <polygon points="30,70 90,90 70,130" fill="#0074D9"/>

  <!-- Center circle white -->
  <circle cx="90" cy="100" r="12" fill="white"/>

  <!-- Prinston Smart Engineers text -->
  <text x="160" y="92" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF4136">Prinston </text>
  <text x="280" y="92" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2ECC40">Smart Engineers</text>
  <text x="160" y="120" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="600">Engineering, Training &amp; IT Services</text>
</svg>
